<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#15151c"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="duck" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="40%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="beak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c7d2fe"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>

  <!-- Glow -->
  <ellipse cx="252" cy="262" rx="178" ry="178" fill="url(#glow)"/>

  <!-- Voice waveform (right side — the duck is speaking) -->
  <g fill="url(#duck)">
    <rect x="436" y="216" width="8" height="40" rx="4"  opacity="0.9"/>
    <rect x="456" y="196" width="8" height="80" rx="4"  opacity="0.65"/>
    <rect x="476" y="172" width="8" height="128" rx="4" opacity="0.4"/>
  </g>

  <!-- Duck head — solid circle, bold -->
  <circle cx="248" cy="260" r="84" fill="url(#duck)"/>

  <!-- Beak — rounded wedge pointing right, lighter gradient -->
  <path d="M322 234 Q400 252 408 264 Q400 280 322 288 Z" fill="url(#beak)"/>

  <!-- Eye -->
  <circle cx="286" cy="244" r="14" fill="#0b0b10"/>
  <circle cx="290" cy="240" r="5.5" fill="#e0e7ff"/>

  <!-- Rim light (top-left) -->
  <path d="M190 220 A84 84 0 0 1 288 182" stroke="#c7d2fe" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.35"/>
</svg>
