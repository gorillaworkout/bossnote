<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#15151c"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="bill" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="55%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea8a08"/>
    </linearGradient>
    <linearGradient id="hat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffaf0"/>
      <stop offset="100%" stop-color="#f2e4c8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <ellipse cx="250" cy="280" rx="180" ry="180" fill="url(#glow)"/>

  <!-- Bow tie (behind head, bottom) -->
  <path d="M 236 372 L 196 352 L 196 392 Z" fill="#ef4444"/>
  <path d="M 236 372 L 276 352 L 276 392 Z" fill="#ef4444"/>
  <circle cx="236" cy="372" r="12" fill="#dc2626"/>

  <!-- Head — cream/white, profile facing right -->
  <path d="M 300 250
           C 300 198 252 172 202 172
           C 150 172 128 214 128 266
           C 128 322 156 350 206 350
           C 258 350 300 318 308 272
           Z" fill="url(#face)"/>

  <!-- Bill — big orange, prominent, pointing right -->
  <path d="M 298 244
           C 330 238 372 244 408 258
           C 430 266 432 292 416 300
           C 384 314 344 314 304 306
           C 296 300 294 258 298 244
           Z" fill="url(#bill)"/>

  <!-- Bill top ridge highlight -->
  <path d="M 298 244 C 330 238 372 244 408 258" stroke="#fde68a" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.7"/>

  <!-- Eye -->
  <ellipse cx="252" cy="238" rx="10" ry="14" fill="#111111"/>

  <!-- Sailor hat — blue crown + band + forward brim -->
  <path d="M 166 210
           L 166 172
           C 166 136 226 118 272 134
           C 300 143 314 158 314 180
           L 314 210
           Z" fill="url(#hat)"/>
  <!-- hat band (ribbon) -->
  <rect x="164" y="198" width="150" height="17" rx="4" fill="#1e3a8a"/>
  <!-- brim (points forward/right) -->
  <path d="M 308 196 L 356 194 C 362 194 362 206 356 206 L 310 208 Z" fill="#111827"/>

  <!-- Voice waveform (right of bill — speaking) -->
  <g fill="#60a5fa">
    <rect x="448" y="246" width="7" height="28" rx="3.5" opacity="0.85"/>
    <rect x="464" y="234" width="7" height="52" rx="3.5" opacity="0.6"/>
    <rect x="480" y="220" width="7" height="80" rx="3.5" opacity="0.35"/>
  </g>
</svg>
